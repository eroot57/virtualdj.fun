<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Song Suggestions | VIRTUALDJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #00f5ff;
            --magenta: #ff00aa;
            --purple: #aa00ff;
            --white: #ffffff;
            --bg-dark: #050510;
            --bg-card: rgba(0, 245, 255, 0.03);
            --border-subtle: rgba(0, 245, 255, 0.12);
            --green: #00ff88;
            --red: #ff4444;
            --yellow: #ffaa00;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--cyan);
            border-radius: 3px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }

        @media (min-width: 768px) {
            .container {
                padding: 3rem 2rem;
            }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header h1 span {
            color: var(--cyan);
        }

        .back-link {
            color: var(--cyan);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--magenta);
        }

        .login-form {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            margin: 4rem auto;
        }

        .login-form h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--cyan);
        }

        .login-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 0.4rem;
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .login-input:focus {
            border-color: var(--cyan);
        }

        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--cyan);
            color: var(--bg-dark);
            border: none;
            border-radius: 0.4rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
        }

        .login-error {
            color: var(--red);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 0.3rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .filter-btn.active {
            background: var(--cyan);
            color: var(--bg-dark);
            border-color: var(--cyan);
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 0.3rem;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-number.pending { color: var(--yellow); }
        .stat-number.approved { color: var(--green); }
        .stat-number.rejected { color: var(--red); }
        .stat-number.total { color: var(--cyan); }

        .stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .suggestion-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 0.5rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .suggestion-card:hover {
            border-color: var(--cyan);
        }

        .suggestion-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .suggestion-info h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .suggestion-info .artist {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .status-badge {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.25rem 0.6rem;
            border-radius: 0.2rem;
            flex-shrink: 0;
        }

        .status-badge.pending {
            color: var(--yellow);
            border: 1px solid rgba(255, 170, 0, 0.3);
            background: rgba(255, 170, 0, 0.1);
        }

        .status-badge.approved {
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.1);
        }

        .status-badge.rejected {
            color: var(--red);
            border: 1px solid rgba(255, 68, 68, 0.3);
            background: rgba(255, 68, 68, 0.1);
        }

        .suggestion-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .suggestion-meta a {
            color: var(--cyan);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .suggestion-meta a:hover {
            color: var(--magenta);
        }

        .suggestion-meta .date {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .suggestion-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: 1px solid;
            border-radius: 0.3rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
        }

        .action-btn.approve {
            color: var(--green);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .action-btn.approve:hover {
            background: var(--green);
            color: var(--bg-dark);
        }

        .action-btn.reject {
            color: var(--red);
            border-color: rgba(255, 68, 68, 0.3);
        }

        .action-btn.reject:hover {
            background: var(--red);
            color: var(--bg-dark);
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>//</span> SONG SUGGESTIONS</h1>
            <a href="/" class="back-link">&larr; Back to Site</a>
        </div>

        <div id="login-section">
            <div class="login-form">
                <h2>ADMIN ACCESS</h2>
                <input type="password" id="admin-password" class="login-input" placeholder="Enter admin password">
                <button id="login-btn" class="login-btn">LOGIN</button>
                <div class="login-error" id="login-error">Invalid password</div>
            </div>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="stats" id="stats">
                <div class="stat">
                    <div class="stat-number total" id="stat-total">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                    <div class="stat-number pending" id="stat-pending">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat">
                    <div class="stat-number approved" id="stat-approved">0</div>
                    <div class="stat-label">Approved</div>
                </div>
                <div class="stat">
                    <div class="stat-number rejected" id="stat-rejected">0</div>
                    <div class="stat-label">Rejected</div>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="approved">Approved</button>
                <button class="filter-btn" data-filter="rejected">Rejected</button>
            </div>

            <div id="suggestions-list"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            let adminPassword = '';
            let currentFilter = 'all';
            let suggestions = [];

            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const passwordInput = document.getElementById('admin-password');
            const loginBtn = document.getElementById('login-btn');
            const loginError = document.getElementById('login-error');
            const suggestionsList = document.getElementById('suggestions-list');

            loginBtn.addEventListener('click', handleLogin);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });

            async function handleLogin() {
                adminPassword = passwordInput.value.trim();
                if (!adminPassword) return;

                try {
                    const response = await fetch('/api/suggestions');
                    if (response.ok) {
                        loginSection.classList.add('hidden');
                        dashboardSection.classList.remove('hidden');
                        loadSuggestions();
                    } else {
                        loginError.classList.add('visible');
                    }
                } catch (err) {
                    loginError.textContent = 'Connection error';
                    loginError.classList.add('visible');
                }
            }

            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(function(b) {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderSuggestions();
                });
            });

            async function loadSuggestions() {
                try {
                    const response = await fetch('/api/suggestions');
                    const data = await response.json();
                    suggestions = data.suggestions || [];
                    updateStats();
                    renderSuggestions();
                } catch (err) {
                    suggestionsList.innerHTML = '<div class="empty-state">Failed to load suggestions</div>';
                }
            }

            function updateStats() {
                document.getElementById('stat-total').textContent = suggestions.length;
                document.getElementById('stat-pending').textContent = suggestions.filter(function(s) { return s.status === 'pending'; }).length;
                document.getElementById('stat-approved').textContent = suggestions.filter(function(s) { return s.status === 'approved'; }).length;
                document.getElementById('stat-rejected').textContent = suggestions.filter(function(s) { return s.status === 'rejected'; }).length;
            }

            function renderSuggestions() {
                const filtered = currentFilter === 'all'
                    ? suggestions
                    : suggestions.filter(function(s) { return s.status === currentFilter; });

                if (filtered.length === 0) {
                    suggestionsList.innerHTML = '<div class="empty-state">No suggestions found</div>';
                    return;
                }

                let html = '';
                filtered.forEach(function(s) {
                    const date = new Date(s.submittedAt).toLocaleDateString();
                    html += '<div class="suggestion-card" data-id="' + s.id + '">';
                    html += '<div class="suggestion-header">';
                    html += '<div class="suggestion-info">';
                    html += '<h3>' + escapeHtml(s.song) + '</h3>';
                    html += '<div class="artist">' + escapeHtml(s.artist) + '</div>';
                    html += '</div>';
                    html += '<span class="status-badge ' + s.status + '">' + s.status + '</span>';
                    html += '</div>';
                    html += '<div class="suggestion-meta">';
                    html += '<a href="' + escapeHtml(s.youtube) + '" target="_blank" rel="noopener">Watch on YouTube</a>';
                    html += '<span class="date">' + date + '</span>';
                    html += '</div>';
                    if (s.status === 'pending') {
                        html += '<div class="suggestion-actions">';
                        html += '<button class="action-btn approve" onclick="updateStatus(\'' + s.id + '\', \'approve\')">Approve</button>';
                        html += '<button class="action-btn reject" onclick="updateStatus(\'' + s.id + '\', \'reject\')">Reject</button>';
                        html += '</div>';
                    }
                    html += '</div>';
                });

                suggestionsList.innerHTML = html;
            }

            window.updateStatus = async function(id, action) {
                try {
                    const response = await fetch('/api/admin/suggest/' + id + '/' + action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: adminPassword })
                    });

                    if (response.ok) {
                        loadSuggestions();
                    } else {
                        alert('Failed to update suggestion');
                    }
                } catch (err) {
                    alert('Network error');
                }
            };

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        })();
    </script>
</body>
</html>
